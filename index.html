<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady</title>
<meta name="theme-color" content="#E9EFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A18" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Atkinson Next";src:url("fonts/atkinson-next.woff2") format("woff2");font-weight:400 800;font-display:swap}
:root{
  --paper:#E9EFEC; --surface:#F8FAF8; --ink:#16302C; --muted:#5A6E69; --line:#CFDAD5;
  --teal:#1E5E58; --teal-ink:#FFFFFF; --teal-soft:#D3E6E1;
  --fluid:#D5E26B; --fluid-deep:#B9C74A;
  --green:#2E7D4F; --yellow:#A87405; --red:#B23A30;
  --green-soft:#DCEFE2; --yellow-soft:#F6EBCD; --red-soft:#F6DEDA;
  --bg:var(--paper); --card:var(--surface); --accent:var(--teal); --accent-ink:var(--teal-ink); --soft:var(--teal-soft);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1A18; --surface:#16241F; --ink:#E3ECE8; --muted:#93A8A2; --line:#2A3B36;
    --teal:#7CC4B9; --teal-ink:#0B1714; --teal-soft:#1F3833;
    --fluid:#BFCC52; --fluid-deep:#A3B03C;
    --green:#6CC48E; --yellow:#E0B04A; --red:#EE8378;
    --green-soft:#1B3326; --yellow-soft:#382E17; --red-soft:#3D221F;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Next",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
main{max-width:560px;margin:0 auto;padding:4px 16px 16px}

/* surfaces: only the main working areas get a card */
.card{background:var(--card);border-radius:var(--r-lg);padding:18px 16px;margin:0 0 14px}
.card h2,.sect h2{font-size:18px;font-weight:700;margin:0 0 10px;letter-spacing:-.005em}
.sect{margin:22px 2px 14px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label.f{display:block;font-size:15px;font-weight:600;color:var(--muted);margin:16px 0 6px}
input[type=number],input[type=text],input[type=tel],textarea,select{width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:var(--r-sm);padding:12px;min-height:48px}
input:focus,textarea:focus,select:focus{border-color:var(--teal);outline:none}
textarea{min-height:80px;resize:vertical}
.big{font-size:34px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

button{cursor:pointer;border-radius:var(--r-sm);border:1.5px solid var(--line);background:transparent;padding:10px 14px;min-height:44px}
button:disabled{opacity:.35}
button.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);font-weight:700;width:100%;min-height:56px;border-radius:var(--r-md);font-size:18px}
button.primary:active{transform:translateY(1px)}
button.link{background:none;border:none;color:var(--teal);padding:6px 0;min-height:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;min-height:48px;background:var(--bg);border-color:transparent}
.seg button.on{background:var(--teal-soft);border-color:var(--teal);font-weight:700}

.toggle{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 14px;border-radius:var(--r-sm);margin:6px 0;background:var(--bg);cursor:pointer;user-select:none}
.toggle .box{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.toggle.on{background:var(--green-soft)}
.toggle.on .box{background:var(--green);border-color:var(--green);color:#fff}

.mode{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px}
.mode.normal{background:var(--green-soft);color:var(--green)}
.mode.lean{background:var(--yellow-soft);color:var(--yellow)}
.mode.crisis{background:var(--red-soft);color:var(--red)}

.banner{border-radius:var(--r-md);padding:14px;margin:0 0 14px;border-left:5px solid}
.banner.info{background:var(--teal-soft);border-color:var(--teal)}
.banner.yellow{background:var(--yellow-soft);border-color:var(--yellow)}
.banner.red{background:var(--red-soft);border-color:var(--red)}
.banner .row{margin-top:10px}
.banner button:not(.link){background:var(--surface);border-color:transparent;font-weight:700}

.muted{color:var(--muted)}
.small{font-size:15px}
.stat{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin:0;background:transparent;border-radius:0;border-top:2px solid var(--line);padding:10px 2px 4px}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:var(--teal);border-radius:999px}
.badge{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.badge:last-child{border-bottom:none}
.badge .e{font-size:24px;width:34px;text-align:center}
.badge.locked{opacity:.4}

/* the level: the one bold element */
.level{margin:2px 0 18px}
.level .num{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.level .num small{font-size:20px;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:4px}
.level .cap{margin:4px 0 14px;color:var(--muted);font-size:15px}
.vial{position:relative;height:44px;border-radius:999px;background:linear-gradient(180deg,var(--fluid) 0%,var(--fluid-deep) 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.12);border:2px solid var(--ink)}
.vial .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.vial .tick.act{width:4px;margin-left:-1px}
.vial .bubble{position:absolute;top:50%;width:52px;height:26px;margin:-13px 0 0 -26px;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#fff 0%,rgba(255,255,255,.85) 45%,rgba(255,255,255,.55) 100%);box-shadow:0 0 0 1.5px rgba(22,48,44,.55);transition:left .9s cubic-bezier(.2,.8,.2,1)}
.vial-labels{position:relative;height:20px;font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
.vial-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.level .status{display:inline-block;margin-top:10px;font-weight:700;padding:4px 12px;border-radius:999px}
.status.green{background:var(--green-soft);color:var(--green)}
.status.yellow{background:var(--yellow-soft);color:var(--yellow)}
.status.red{background:var(--red-soft);color:var(--red)}
.level.empty{background:var(--card);border-radius:var(--r-lg);padding:16px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.vial .bubble{transition:none}}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -1px 0 var(--line)}
nav button{flex:1;border:none;border-radius:0;background:none;padding:0;min-height:56px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
nav button span{display:grid;place-items:center;width:60px;height:32px;border-radius:999px;transition:background .2s}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);font-weight:800}
nav button.on span{background:var(--teal-soft)}

.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:var(--r-md);font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
svg text{fill:var(--muted);font-size:10px;font-family:"Atkinson Next",sans-serif}
.datenav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.datenav b{font-size:18px}
.datenav button{min-width:48px;min-height:44px;border-color:transparent;background:var(--card);font-size:20px;line-height:1}

.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.dot.green{background:var(--green)} .dot.yellow{background:var(--yellow)} .dot.red{background:var(--red)}
.cbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line);gap:2px}
.cbar .green{background:var(--green)} .cbar .yellow{background:var(--yellow)} .cbar .red{background:var(--red)}
.item{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item button.x{border:none;color:var(--muted);min-width:44px}
.pick{width:100%;text-align:left;display:flex;align-items:center;gap:12px;margin:6px 0;background:var(--bg);border-color:transparent;min-height:52px}
.pick .name{flex:1}
.sheet{position:fixed;inset:0;background:rgba(10,24,21,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.seg.color button.on.g{background:var(--green-soft);border-color:var(--green)}
.seg.color button.on.y{background:var(--yellow-soft);border-color:var(--yellow)}
.seg.color button.on.r{background:var(--red-soft);border-color:var(--red)}
video{width:100%;border-radius:var(--r-md);background:#000}
</style>
</head>
<body>
<header>
  <h1>Steady</h1>
  <span id="modePill" class="mode normal">Normal</span>
</header>
<main id="view"></main>
<nav>
  <button data-tab="today" class="on"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Today</button>
  <button data-tab="food"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/></svg></span>Food</button>
  <button data-tab="trend"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 3 8-8"/><path d="M15 6h6v6"/></svg></span>Trend</button>
  <button data-tab="game"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.2.7-4.6 4.2 1.3 6.1L12 16.5l-5.5 3.1 1.3-6.1-4.6-4.2 6.2-.7z"/></svg></span>Game</button>
  <button data-tab="plan"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>My Plan</button>
</nav>
<div id="toast" class="toast"></div>
<div id="sheet"></div>

<script>
'use strict';
// In the Android app, Capacitor provides the HealthWeight plugin. On the web this is null.
const Native = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.Plugins.HealthWeight : null;
// ---------- storage ----------
const KEY = 'steady.v1';
const DEFAULTS = {
  settings: {
    proteinTarget: 150, stepTarget: 8000,
    phase: 'loss',            // 'loss' or 'maintain'
    goalLow: null, goalHigh: null,
    yellow: 3, red: 5,        // tripwire thresholds (lb above reference)
    crisisPlan: 'Weigh in every morning. Protein at every meal. Walk outside once.',
    actionPlan: 'Go back to full tracking for 2 weeks. Review what changed. Message my doctor if it keeps rising.',
    partnerName: '', partnerPhone: '',
    calorieTarget: null,
    calc: null                // last calorie calculator inputs
  },
  mode: 'normal',
  modeHistory: [],            // [{date, mode}]
  entries: {},                // 'YYYY-MM-DD' -> entry
  dismissed: {},              // suggestion key -> date
  events: [],                 // [{date, type, text}]
  food: {},                   // 'YYYY-MM-DD' -> [{id, name, kcal, protein, color, meal, grams}]
  foods: [],                  // saved "usual foods"
  scale: {},                  // 'YYYY-MM-DD' -> lb, read from Health Connect (Android app only)
  hc: {enabled: false, last: null}
};
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULTS);
    const s = JSON.parse(raw);
    return {...structuredClone(DEFAULTS), ...s, settings:{...DEFAULTS.settings, ...(s.settings||{})}};
  }catch(e){ return structuredClone(DEFAULTS); }
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save — storage blocked'); } }
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

// ---------- dates ----------
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ds(d); };
const today = () => ds(new Date());
const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const nice = s => parse(s).toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});

// ---------- calculations ----------
const MODES = {normal:'Normal', lean:'Lean', crisis:'Crisis'};
const MULT = {normal:1, lean:1.5, crisis:2};
const sortedDates = () => Object.keys(S.entries).sort();
// A typed weight in a check-in wins; otherwise use the scale reading for that day.
const weightOn = d => S.entries[d]?.weight ?? S.scale[d] ?? null;
const weightDates = () => [...new Set([...Object.keys(S.entries), ...Object.keys(S.scale)])].filter(d => weightOn(d)).sort();

function avg7(date, minN=1){
  let sum=0, n=0;
  for(let i=0;i<7;i++){ const w = weightOn(addDays(date,-i)); if(w){ sum+=w; n++; } }
  return n>=minN ? sum/n : null;
}
function latestWeightDate(){
  const ds_ = weightDates();
  return ds_.length ? ds_[ds_.length-1] : null;
}
function entryPoints(e){
  let p = 5;                       // showing up
  if(e.weight) p += 5;
  if(e.protein) p += 10;
  if(e.steps) p += 10;
  if(e.workout) p += 10;
  return Math.round(p * (MULT[e.mode] || 1));
}
function totals(){
  let pts = 0;
  for(const d of sortedDates()) pts += entryPoints(S.entries[d]);
  for(const d in S.food) pts += foodPoints(d);
  const level = Math.floor(pts/300) + 1;
  return {pts, level, into: pts % 300};
}
// Streak counts check-ins (any mode). Freeze days cover missed days while you have them.
function streakInfo(){
  const dates = sortedDates(); const t = today();
  let streak=0, freezes=2, best=0;
  if(!dates.length) return {streak, freezes, best};
  for(let d = dates[0]; d <= t; d = addDays(d,1)){
    if(S.entries[d]){ streak++; if(streak % 7 === 0) freezes = Math.min(3, freezes+1); }
    else if(d === t){ /* today not done yet */ }
    else if(streak > 0 && freezes > 0){ freezes--; }
    else streak = 0;
    best = Math.max(best, streak);
  }
  return {streak, freezes, best};
}
function daysMissed(){
  const t = today();
  if(S.entries[t]) return 0;
  const dates = sortedDates().filter(d => d < t);
  if(!dates.length) return 0;
  return diffDays(dates[dates.length-1], t) - 1;
}
function tripwire(){
  const lw = latestWeightDate(); if(!lw) return null;
  const cur = avg7(lw, 3); if(cur == null) return null;
  const st = S.settings; let ref, basis;
  if(st.phase === 'maintain' && st.goalHigh){ ref = +st.goalHigh; basis = 'top of your goal range'; }
  else {
    let lo = Infinity;
    for(let i=0;i<60;i++){ const a = avg7(addDays(lw,-i), 3); if(a != null && a < lo) lo = a; }
    ref = lo; basis = 'your recent low (7-day average)';
  }
  const over = cur - ref;
  const level = over >= st.red ? 'red' : over >= st.yellow ? 'yellow' : 'green';
  return {cur, ref, over, level, basis, yellowAt: ref + +st.yellow, redAt: ref + +st.red};
}
function modeSince(){
  for(let i=S.modeHistory.length-1;i>=0;i--) if(S.modeHistory[i].mode === S.mode) return S.modeHistory[i].date;
  return null;
}
function goodDay(e){
  if(!e) return false;
  if(e.mode === 'crisis') return true;
  if(e.mode === 'lean') return !!(e.protein && e.steps);
  return !!(e.protein && e.steps);
}
function recentDays(n, endInclusive){
  const out=[]; for(let i=0;i<n;i++) out.push(addDays(endInclusive,-i)); return out;
}
function dismissedRecently(key, days=7){
  const d = S.dismissed[key]; return d && diffDays(d, today()) < days;
}

// ---------- suggestions ----------
function suggestions(){
  const out = []; const t = today(); const st = S.settings;
  const missed = daysMissed();
  if(missed >= 2 && S.mode !== 'crisis' && !dismissedRecently('crisis-'+t, 1))
    out.push({key:'crisis-'+t, cls:'info', html:`Welcome back. You missed ${missed} days — that happens. Want to switch to <b>Crisis mode</b> for a bit? It's just a weigh-in and one tap a day.`,
      actions:[['Switch to Crisis', ()=>setMode('crisis')]]});
  if(missed >= 3 && st.partnerPhone && !dismissedRecently('partner-'+t, 1)){
    const msg = encodeURIComponent(`Hey ${st.partnerName||''} — I've gone quiet on my health check-ins for a few days. Just letting you know, like we agreed.`);
    out.push({key:'partner-'+t, cls:'info', html:`It's been ${missed} days. You asked to let <b>${esc(st.partnerName||'your partner')}</b> know when this happens.`,
      actions:[['Send text', ()=>{ location.href = `sms:${st.partnerPhone}?body=${msg}`; }]]});
  }
  const tw = tripwire();
  if(tw && tw.level === 'red' && !dismissedRecently('red-'+Math.round(tw.ref),3))
    out.push({key:'red-'+Math.round(tw.ref), cls:'red', html:`<b>Red tripwire:</b> your 7-day average (${tw.cur.toFixed(1)}) is ${tw.over.toFixed(1)} lb above ${tw.basis}. Time for your action plan:<br><i>${esc(st.actionPlan)}</i>`, actions:[]});
  else if(tw && tw.level === 'yellow' && !dismissedRecently('yellow-'+Math.round(tw.ref)))
    out.push({key:'yellow-'+Math.round(tw.ref), cls:'yellow', html:`<b>Yellow tripwire:</b> your 7-day average is ${tw.over.toFixed(1)} lb above ${tw.basis}. ${S.mode==='normal'?'Lean mode for a week might help — and look back at the last 2 weeks on the Trend tab.':'Look back at the last 2 weeks on the Trend tab.'}`,
      actions: S.mode==='normal' ? [['Switch to Lean', ()=>setMode('lean')]] : []});
  // recalculate calorie target after 10 lb change
  const c = st.calc, lwd = latestWeightDate();
  if(c && c.weight && lwd){
    const a = avg7(lwd, 3);
    if(a != null && Math.abs(c.weight - a) >= 10 && !dismissedRecently('recalc-'+c.weight, 14))
      out.push({key:'recalc-'+c.weight, cls:'info', html:`Your weight has changed ${Math.abs(c.weight - a).toFixed(0)} lb since you set your calorie target. Worth recalculating.`,
        actions:[['Open calculator', ()=>{ tab='plan'; render(); document.getElementById('calcCard')?.scrollIntoView(); }]]});
  }
  // step back up
  if(S.mode !== 'normal'){
    const since = modeSince();
    const end = S.entries[t] ? t : addDays(t,-1);
    const last5 = recentDays(5, end);
    if(since && diffDays(since, t) >= 5 && last5.every(d => goodDay(S.entries[d])) && !dismissedRecently('up-'+S.mode)){
      const next = S.mode === 'crisis' ? 'lean' : 'normal';
      out.push({key:'up-'+S.mode, cls:'info', html:`5 solid days in ${MODES[S.mode]} mode. Ready to step up to <b>${MODES[next]}</b>? No pressure — staying put is fine too.`,
        actions:[[`Step up to ${MODES[next]}`, ()=>setMode(next)]]});
    }
  }
  // raise step target
  if(S.mode === 'normal'){
    const end = S.entries[t] ? t : addDays(t,-1);
    const last7 = recentDays(7, end);
    if(last7.every(d => S.entries[d] && S.entries[d].steps && S.entries[d].mode==='normal') && !dismissedRecently('raise-'+st.stepTarget, 14)){
      const nt = +st.stepTarget + 500;
      out.push({key:'raise-'+st.stepTarget, cls:'info', html:`You hit your step goal 7 days running. Raise it from ${(+st.stepTarget).toLocaleString()} to <b>${nt.toLocaleString()}</b>?`,
        actions:[['Raise it', ()=>{ S.events.push({date:t,type:'raise',text:`Steps ${(+st.stepTarget).toLocaleString()} → ${nt.toLocaleString()}`}); st.stepTarget = nt; save(); toast('Step goal raised 📈'); render(); }]]});
    }
  }
  return out;
}


// ---------- the level (Today hero) ----------
let levelAnimated = false;
function levelHtml(){
  const tw = tripwire(), st = S.settings;
  if(!tw) return `<div class="level empty">Weigh in on 3 mornings and your level appears here. It tracks your 7-day average, so one salty dinner won't move it much.</div>`;
  const maint = st.phase === 'maintain' && st.goalHigh;
  const refName = maint ? 'top of your range' : 'recent low';
  const lo = Math.min(maint && st.goalLow ? +st.goalLow - 1 : tw.ref - 3, tw.cur - 1);
  const hi = Math.max(tw.redAt + 2, tw.cur + 1);
  const pos = v => Math.max(4, Math.min(96, (v - lo) / (hi - lo) * 100));
  const msg = {green:'Steady', yellow:'Drifting up. Watch this week.', red:'Past your line. Time for your action plan.'}[tw.level];
  const o = tw.over;
  const cap = Math.abs(o) < 0.05 ? `At your ${refName}` : o < 0 ? `${(-o).toFixed(1)} lb below your ${refName}` : `${o.toFixed(1)} lb above your ${refName}`;
  return `<section class="level" aria-label="Weight level">
    <div class="num">${tw.cur.toFixed(1)}<small>lb</small></div>
    <div class="cap">7-day average. ${cap}.</div>
    <div class="vial" role="img" aria-label="${msg}">
      <span class="tick" style="left:${pos(tw.ref)}%"></span><span class="tick" style="left:${pos(tw.yellowAt)}%"></span><span class="tick act" style="left:${pos(tw.redAt)}%"></span>
      <span class="bubble" id="bubble" data-x="${pos(tw.cur)}" style="left:${levelAnimated ? pos(tw.cur) : 50}%"></span></div>
    <div class="vial-labels"><span style="left:${pos(tw.ref)}%">${maint ? 'range top' : 'low'}</span><span style="left:${pos(tw.yellowAt)}%">watch</span><span style="left:${pos(tw.redAt)}%">act</span></div>
    <span class="status ${tw.level}">${msg}</span></section>`;
}

// ---------- actions ----------
function setMode(m){
  if(S.mode === m) return;
  S.mode = m; S.modeHistory.push({date: today(), mode: m});
  const e = S.entries[today()]; if(e) e.mode = m;
  if(draft && draft._date === today()) draft.mode = m;
  save();
  toast(m === 'normal' ? 'Back to Normal 🟢' : m === 'lean' ? 'Lean mode — keep it simple 🟡' : 'Crisis mode — just show up 🔴');
  render();
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

// ---------- views ----------
let tab = 'today';
let editDate = today();
let draft = null;
let trendRange = 30;
const view = document.getElementById('view');

function render(){
  const pill = document.getElementById('modePill');
  pill.className = 'mode ' + S.mode; pill.textContent = MODES[S.mode];
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ({today:renderToday, food:renderFood, trend:renderTrend, game:renderGame, plan:renderPlan})[tab]();
  window.scrollTo(0,0);
}

function renderToday(){
  const existing = S.entries[editDate];
  if(!draft || draft._date !== editDate){
    draft = existing ? {...existing} : {mode: S.mode, weight: S.scale[editDate] ?? null, sleep:null, stress:null, protein:false, steps:false, workout:false, focus:'', note:''};
    draft._date = editDate;
    const ft = foodTotals(editDate);
    if(!existing && ft.protein >= S.settings.proteinTarget) draft.protein = true;
  }
  const m = draft.mode; const st = S.settings; const t = today();
  const sk = streakInfo();
  let html = '';
  if(editDate === t) for(const s of suggestions())
    html += `<div class="banner ${s.cls}">${s.html}<div class="row">${s.actions.map((a,i)=>`<button data-sa="${s.key}|${i}">${a[0]}</button>`).join('')}<button class="link" data-dismiss="${s.key}">Not now</button></div></div>`;

  if(editDate === t) html += levelHtml();
  html += `<div class="datenav"><button id="prevDay" aria-label="Previous day">‹</button><b>${editDate===t?'Today':nice(editDate)}</b><button id="nextDay" aria-label="Next day" ${editDate>=t?'disabled':''}>›</button></div>`;
  html += `<div class="card">
    <div class="row between"><h2 style="margin:0">Check-in</h2>${m !== S.mode ? `<span class="mode ${m}">${MODES[m]}</span>` : ''}</div>
    <label class="f">Weight (lb)${draft.weight != null && draft.weight === S.scale[editDate] ? ' · ⚖️ from your scale' : ''}</label>
    <input id="weight" class="big" type="number" inputmode="decimal" step="0.1" placeholder="—" value="${draft.weight ?? ''}">`;
  if(m === 'normal'){
    html += `<label class="f">Sleep</label>
      <div class="seg" data-field="sleep">${['😴 Poor','😐 OK','🙂 Good'].map((l,i)=>`<button class="${draft.sleep===i?'on':''}" data-v="${i}">${l}</button>`).join('')}</div>
      <label class="f">Stress</label>
      <div class="seg" data-field="stress">${[1,2,3,4,5].map(v=>`<button class="${draft.stress===v?'on':''}" data-v="${v}">${v}</button>`).join('')}</div>`;
  }
  if(m === 'crisis'){
    html += `<p class="small muted" style="margin:12px 0 4px">Your minimum: <i>${esc(st.crisisPlan)}</i></p>`;
    html += toggleHtml('protein', 'Protein at meals') + toggleHtml('steps', 'Walked outside');
  } else {
    html += `<label class="f">Behaviors</label>`;
    html += toggleHtml('protein', `Protein target (${st.proteinTarget} g)`);
    html += toggleHtml('steps', `Steps (${(+st.stepTarget).toLocaleString()})`);
    if(m === 'normal') html += toggleHtml('workout', 'Workout');
  }
  if(m === 'normal')
    html += `<label class="f">Today's one focus</label><input id="focus" type="text" placeholder="e.g. protein at lunch" value="${esc(draft.focus)}">`;
  if(m !== 'crisis')
    html += `<label class="f">${m==='normal'?'Notes / tomorrow\'s tricky moment & plan':'Note (optional)'}</label><textarea id="note" placeholder="If ___ happens, I will ___">${esc(draft.note)}</textarea>`;
  html += `<div style="margin-top:14px"><button class="primary" id="saveBtn">${m==='crisis' ? 'Got through today 👍' : existing ? 'Update check-in' : 'Save check-in'}</button></div>
    ${existing ? `<p class="small muted" style="text-align:center;margin:8px 0 0">Checked in ✓ · ${entryPoints(existing)} pts${existing.mode!=='normal'?` (${MULT[existing.mode]}× ${MODES[existing.mode]} bonus)`:''}</p>` : ''}
  </div>`;

  const ft = foodTotals(editDate);
  html += `<section class="sect" id="foodSummary" style="cursor:pointer"><div class="row between"><h2 style="margin:0">Food today</h2><button class="link">Log food</button></div>
    ${ft.n ? `<div style="margin:6px 0 8px"><b>${ft.kcal.toLocaleString()}</b>${st.calorieTarget?` of ${(+st.calorieTarget).toLocaleString()}`:''} calories, <b>${Math.round(ft.protein)} g</b> protein</div>${colorBar(ft)}`
           : `<p class="small muted" style="margin:4px 0 0">${m==='normal'?'Nothing logged yet.':'Optional in '+MODES[m]+' mode.'}</p>`}</section>`;
  html += `<section class="sect"><div class="row between">
      <div><div class="stat">🔥 ${sk.streak}</div><div class="small muted">day streak</div></div>
      <div><div class="stat">❄️ ${sk.freezes}</div><div class="small muted">freeze days</div></div>
      <div><div class="stat">⭐ ${totals().level}</div><div class="small muted">level</div></div>
    </div></section>`;

  html += `<section class="sect"><h2>Rough day? Change mode</h2>
    <div class="seg" id="modeSeg">${Object.keys(MODES).map(k=>`<button class="${S.mode===k?'on':''}" data-mode="${k}">${MODES[k]}</button>`).join('')}</div>
    <p class="small muted" style="margin:8px 0 0">${modeBlurb(S.mode)}</p></section>`;
  view.innerHTML = html;
  const bub = document.getElementById('bubble');
  if(bub && !levelAnimated){ levelAnimated = true; requestAnimationFrame(() => requestAnimationFrame(() => { bub.style.left = bub.dataset.x + '%'; })); }

  // wiring
  const w = document.getElementById('weight');
  w.oninput = () => { draft.weight = w.value === '' ? null : parseFloat(w.value); };
  view.querySelectorAll('.seg[data-field]').forEach(seg => seg.onclick = ev => {
    const b = ev.target.closest('button'); if(!b) return;
    const f = seg.dataset.field, v = +b.dataset.v;
    draft[f] = draft[f] === v ? null : v; renderToday();
  });
  view.querySelectorAll('.toggle').forEach(el => el.onclick = () => { draft[el.dataset.f] = !draft[el.dataset.f]; renderToday(); });
  const fo = document.getElementById('focus'); if(fo) fo.oninput = () => draft.focus = fo.value;
  const no = document.getElementById('note'); if(no) no.oninput = () => draft.note = no.value;
  document.getElementById('saveBtn').onclick = saveEntry;
  document.getElementById('foodSummary').onclick = () => { tab = 'food'; render(); };
  document.getElementById('prevDay').onclick = () => { editDate = addDays(editDate,-1); renderToday(); };
  document.getElementById('nextDay').onclick = () => { if(editDate < t){ editDate = addDays(editDate,1); renderToday(); } };
  view.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  const sugg = editDate === t ? suggestions() : [];
  view.querySelectorAll('[data-sa]').forEach(b => b.onclick = () => {
    const [key, i] = b.dataset.sa.split('|'); const s = sugg.find(x => x.key === key);
    if(s){ S.dismissed[key] = t; save(); s.actions[+i][1](); }
  });
  view.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = () => { S.dismissed[b.dataset.dismiss] = t; save(); renderToday(); });
}
function toggleHtml(f, label){
  return `<div class="toggle ${draft[f]?'on':''}" data-f="${f}"><span>${label}</span><span class="box">${draft[f]?'✓':''}</span></div>`;
}
function modeBlurb(m){
  return m === 'normal' ? 'Full check-in: weight, sleep, stress, behaviors, one focus.'
    : m === 'lean' ? 'Short check-in: weight, protein, steps. Points ×1.5.'
    : 'Tiny check-in: weigh in and tap one button. Still counts for your streak. Points ×2.';
}
function saveEntry(){
  const wasNew = !S.entries[editDate];
  const before = streakInfo().streak;
  const e = {...draft}; delete e._date; e.t = Date.now();
  if(e.weight != null && (isNaN(e.weight) || e.weight < 50 || e.weight > 900)){ toast('That weight looks off — check it?'); return; }
  S.entries[editDate] = e; save();
  const after = streakInfo().streak;
  let msg = `Saved · +${entryPoints(e)} pts`;
  if(wasNew && [7,14,30,60,100,180,365].includes(after) && after > before) msg = `🔥 ${after}-day streak! +${entryPoints(e)} pts`;
  else if(e.mode === 'crisis') msg = `Showed up on a hard day 🛡️ +${entryPoints(e)} pts`;
  toast(msg); draft = null; renderToday();
}

function renderTrend(){
  const t = today(); const st = S.settings;
  const dates = weightDates();
  let html = `<div class="card"><div class="row between"><h2 style="margin:0">Weight</h2>
    <div class="seg" id="rangeSeg" style="width:180px">${[[30,'30d'],[90,'90d'],[0,'All']].map(([v,l])=>`<button class="${trendRange===v?'on':''}" data-r="${v}">${l}</button>`).join('')}</div></div>`;
  if(dates.length < 2){
    html += `<p class="muted">Log a few weigh-ins and your trend will show up here. The 7-day average line matters more than any single day.</p></div>`;
    view.innerHTML = html; wireRange(); return;
  }
  const start = trendRange ? addDays(t, -trendRange+1) : dates[0];
  const days = []; for(let d = start; d <= t; d = addDays(d,1)) days.push(d);
  const lastW = dates[dates.length-1];
  const pts = days.map((d,i) => ({i, w: weightOn(d), a: d <= lastW ? avg7(d, 1) : null}));
  const tw = tripwire();
  const vals = pts.flatMap(p => [p.w, p.a]).filter(v => v != null);
  if(st.goalLow && st.goalHigh && st.phase==='maintain'){ vals.push(+st.goalLow, +st.goalHigh); }
  if(tw && tw.level !== 'green') vals.push(tw.yellowAt);
  if(!vals.length){ html += `<p class="muted">No weigh-ins in this range.</p></div>`; view.innerHTML = html; wireRange(); return; }
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const W = 340, H = 200, L = 34, R = 8, T = 10, B = 22;
  const x = i => L + (days.length === 1 ? 0 : i * (W-L-R) / (days.length-1));
  const y = v => T + (hi - v) * (H-T-B) / (hi - lo);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight trend">`;
  for(let k=0;k<=4;k++){ const v = lo + (hi-lo)*k/4; svg += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v.toFixed(0)}</text>`; }
  if(st.phase==='maintain' && st.goalLow && st.goalHigh)
    svg += `<rect x="${L}" width="${W-L-R}" y="${y(+st.goalHigh)}" height="${y(+st.goalLow)-y(+st.goalHigh)}" fill="var(--green)" opacity=".15"/>`;
  if(tw) svg += `<line x1="${L}" x2="${W-R}" y1="${y(tw.yellowAt)}" y2="${y(tw.yellowAt)}" stroke="var(--yellow)" stroke-dasharray="4 3"/>`;
  for(const p of pts) if(p.w != null) svg += `<circle cx="${x(p.i)}" cy="${y(p.w)}" r="2.5" fill="var(--muted)" opacity=".6"/>`;
  const line = pts.filter(p => p.a != null).map(p => `${x(p.i).toFixed(1)},${y(p.a).toFixed(1)}`).join(' ');
  svg += `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  svg += `<text x="${L}" y="${H-6}">${nice(days[0])}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${nice(days[days.length-1])}</text></svg>`;
  html += svg + `<p class="small muted" style="margin:6px 0 0">Dots = daily weigh-ins · line = 7-day average${tw?' · dashed = yellow tripwire':''}${st.phase==='maintain'&&st.goalLow?' · band = goal range':''}</p></div>`;

  const lw = dates[dates.length-1];
  const cur = avg7(lw), wkAgo = avg7(addDays(lw,-7)), first = avg7(addDays(dates[0],6));
  html += `<div class="grid2">
    <div class="card"><div class="small muted">7-day average</div><div class="stat">${cur.toFixed(1)}</div></div>
    <div class="card"><div class="small muted">vs last week</div><div class="stat">${wkAgo!=null?fmtDelta(cur-wkAgo):'—'}</div></div>
    <div class="card"><div class="small muted">Since start</div><div class="stat">${first!=null?fmtDelta(cur-first):'—'}</div></div>
    <div class="card"><div class="small muted">Tripwire</div><div class="stat" style="color:var(--${tw?tw.level:'muted'})">${tw?{green:'🟢 OK',yellow:'🟡 Watch',red:'🔴 Act'}[tw.level]:'—'}</div>${tw?`<div class="small muted">yellow at ${tw.yellowAt.toFixed(1)}</div>`:''}</div>
  </div>`;

  // last 14 days log
  html += `<section class="sect"><h2>Last 14 days</h2>`;
  for(const d of recentDays(14, t)){
    const e = S.entries[d];
    html += `<div class="row between small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${nice(d)}</span>
      <span>${e ? `${weightOn(d) ?? '—'} · ${e.protein?'🍗':'·'}${e.steps?'👟':'·'}${e.workout?'🏋️':'·'} <span class="mode ${e.mode}">${MODES[e.mode][0]}</span>` : `<span class="muted">${d===t?'not yet':'missed'}</span>`}</span></div>`;
  }
  html += `</section>`;
  view.innerHTML = html; wireRange();
}
function fmtDelta(v){ return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1); }
function wireRange(){ view.querySelectorAll('#rangeSeg button').forEach(b => b.onclick = () => { trendRange = +b.dataset.r; renderTrend(); }); }

function renderGame(){
  const tt = totals(), sk = streakInfo(), t = today();
  const dates = sortedDates();
  const week = recentDays(7, t).filter(d => S.entries[d]).length;
  const rough = dates.filter(d => S.entries[d].mode !== 'normal').length;
  const wdates = weightDates();
  let lost = 0;
  if(wdates.length >= 2){ const f = avg7(addDays(wdates[0],6)); const c = avg7(wdates[wdates.length-1]); if(f!=null && c!=null) lost = f - c; }
  const st = S.settings;
  const inRange = (st.goalLow && st.goalHigh) ? dates.filter(d => { const a = avg7(d,3); return a!=null && a >= st.goalLow && a <= st.goalHigh; }).length : 0;

  let html = `<div class="card"><div class="row between"><div><div class="stat">Level ${tt.level}</div><div class="small muted">${tt.pts.toLocaleString()} points</div></div><div class="small muted">${300-tt.into} to next</div></div>
    <div class="bar" style="margin-top:10px"><div style="width:${tt.into/3}%"></div></div></div>
  <div class="card"><h2>This week</h2><div class="row between"><span>${week}/7 check-ins</span><span>🔥 ${sk.streak} · best ${sk.best}</span></div>
    <div class="bar" style="margin-top:8px"><div style="width:${week/7*100}%"></div></div>
    <p class="small muted" style="margin:8px 0 0">Streak counts any check-in, any mode. You have ❄️ ${sk.freezes} freeze day${sk.freezes===1?'':'s'} (earn one every 7 days, max 3).</p></div>`;

  const badges = [];
  badges.push({e:'🛡️', t:'Showed up on a rough day', d: rough ? `${rough} time${rough===1?'':'s'} — these earn bonus points` : 'Check in during Lean or Crisis mode', on: rough>0});
  for(const n of [7,30,100,365]) badges.push({e:'🔥', t:`${n}-day streak`, d: sk.best>=n ? 'Earned' : `${Math.max(0,n-sk.best)} to go`, on: sk.best>=n});
  for(const n of [5,10,20,30,40,50,60,75,100]){ if(n > 10 && lost < n-10) break; badges.push({e:'⚖️', t:`${n} lb down (7-day avg)`, d: lost>=n?'Earned':`${(n-lost).toFixed(1)} to go`, on: lost>=n}); }
  if(st.phase === 'maintain') badges.push({e:'🎯', t:'Days in goal range', d: `${inRange} days`, on: inRange>0});
  for(const ev of S.events.filter(e=>e.type==='raise')) badges.push({e:'📈', t:'Goal raised', d:`${ev.text} · ${nice(ev.date)}`, on:true});
  html += `<section class="sect"><h2>Badges</h2>${badges.map(b=>`<div class="badge ${b.on?'':'locked'}"><span class="e">${b.e}</span><div><div>${b.t}</div><div class="small muted">${b.d}</div></div></div>`).join('')}</section>`;
  html += `<p class="sect small muted">Points: +5 check-in, +5 weigh-in, +10 each for protein, steps, workout. Lean ×1.5, Crisis ×2. Food: +10 for logging anything, +5 more for 3+ items. Points are for logging, never for the number, and the scale itself is never scored.</p>`;
  view.innerHTML = html;
}

function renderPlan(){
  const st = S.settings;
  const f = (id, label, type='number', extra='') => `<label class="f" for="${id}">${label}</label><input id="${id}" type="${type}" ${type==='number'?'inputmode="decimal"':''} value="${esc(st[id] ?? '')}" ${extra}>`;
  view.innerHTML = `
  <div class="card"><h2>Targets</h2>
    <div class="grid2"><div>${f('proteinTarget','Protein (g/day)')}</div><div>${f('stepTarget','Steps/day')}</div></div>
    ${f('calorieTarget','Calories/day')}</div>
  ${calcCardHtml()}
  <div class="card"><h2>Phase & tripwires</h2>
    <label class="f">Phase</label>
    <select id="phase"><option value="loss" ${st.phase==='loss'?'selected':''}>Losing — tripwire vs my recent low</option><option value="maintain" ${st.phase==='maintain'?'selected':''}>Maintaining — tripwire vs my goal range</option></select>
    <div class="grid2"><div>${f('goalLow','Goal range low (lb)')}</div><div>${f('goalHigh','Goal range high (lb)')}</div></div>
    <div class="grid2"><div>${f('yellow','🟡 Yellow at +lb')}</div><div>${f('red','🔴 Red at +lb')}</div></div>
    <label class="f" for="actionPlan">🔴 When I hit red, I will…</label><textarea id="actionPlan">${esc(st.actionPlan)}</textarea></div>
  <div class="card"><h2>Crisis plan</h2>
    <p class="small muted" style="margin:0">Write this while things are calm. It's what you'll see on hard days.</p>
    <label class="f" for="crisisPlan">My minimum is…</label><textarea id="crisisPlan">${esc(st.crisisPlan)}</textarea></div>
  <div class="card"><h2>Accountability partner</h2>
    <p class="small muted" style="margin:0">Optional. After 3 missed days, the app offers to text them (you still hit send).</p>
    ${f('partnerName','Name','text')}${f('partnerPhone','Phone','tel')}</div>
  ${Native ? scaleCardHtml() : ''}
  <button class="primary" id="savePlan">Save plan</button>
  <div class="card" style="margin-top:12px"><h2>Your data</h2>
    <p class="small muted" style="margin:0 0 8px">Everything is stored only on this phone. Export a backup now and then.</p>
    <div class="row"><button id="exportBtn">⬇️ Export backup</button><button id="importBtn">⬆️ Import</button><input id="importFile" type="file" accept="application/json" hidden></div>
    <p class="small muted">${Object.keys(S.entries).length} check-ins stored.</p>
    <button class="link" id="resetBtn" style="color:var(--red)">Erase all data</button></div>`;
  document.getElementById('savePlan').onclick = () => {
    const num = id => { const v = document.getElementById(id).value; return v === '' ? null : parseFloat(v); };
    for(const id of ['proteinTarget','stepTarget','calorieTarget','goalLow','goalHigh','yellow','red']) st[id] = num(id);
    st.proteinTarget ??= 150; st.stepTarget ??= 8000; st.yellow ??= 3; st.red ??= 5;
    if(st.goalLow && st.goalHigh && st.goalLow > st.goalHigh) [st.goalLow, st.goalHigh] = [st.goalHigh, st.goalLow];
    st.phase = document.getElementById('phase').value;
    for(const id of ['actionPlan','crisisPlan','partnerName','partnerPhone']) st[id] = document.getElementById(id).value.trim();
    save(); toast('Plan saved'); render();
  };
  wireCalc();
  if(Native) wireScale();
  document.getElementById('exportBtn').onclick = async () => {
    if(Native){   // Android app: write a file, then open the share sheet (Drive, Files, email…)
      try{
        const {Filesystem, Share} = window.Capacitor.Plugins;
        const r = await Filesystem.writeFile({path: `steady-backup-${today()}.json`, data: JSON.stringify(S, null, 2), directory: 'CACHE', encoding: 'utf8'});
        await Share.share({title: 'Steady backup', files: [r.uri]});
      }catch(e){ if(!/cancel/i.test(e.message||'')) toast('Export failed: ' + (e.message || e)); }
      return;
    }
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `steady-backup-${today()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };
  const fi = document.getElementById('importFile');
  document.getElementById('importBtn').onclick = () => fi.click();
  fi.onchange = async () => {
    try{
      const d = JSON.parse(await fi.files[0].text());
      if(!d.entries || !d.settings) throw new Error('bad file');
      if(!confirm('Replace current data with this backup?')) return;
      S = {...structuredClone(DEFAULTS), ...d, settings:{...DEFAULTS.settings, ...d.settings}}; save(); toast('Backup restored'); render();
    }catch(e){ toast("That file doesn't look like a Steady backup"); }
  };
  document.getElementById('resetBtn').onclick = () => {
    if(confirm('Erase ALL check-ins and settings? Export a backup first if unsure.')){ S = structuredClone(DEFAULTS); save(); render(); }
  };
}

const uid = () => Math.random().toString(36).slice(2,10);
function dayFood(d){ return S.food[d] || []; }
function foodTotals(d){
  const t = {kcal:0, protein:0, green:0, yellow:0, red:0, n:0};
  for(const it of dayFood(d)){ t.n++; t.kcal += it.kcal||0; t.protein += it.protein||0; t[it.color] = (t[it.color]||0) + (it.kcal||0); }
  t.kcal = Math.round(t.kcal); return t;
}
function foodPoints(d){ const n = dayFood(d).length; return n ? 10 + (n >= 3 ? 5 : 0) : 0; }
function colorBar(t){
  const tot = t.green + t.yellow + t.red; if(!tot) return '';
  const pct = c => (t[c]/tot*100).toFixed(1);
  return `<div class="cbar">${['green','yellow','red'].map(c => `<div class="${c}" style="width:${pct(c)}%"></div>`).join('')}</div>
    <div class="row small muted" style="margin-top:6px;gap:14px">${['green','yellow','red'].map(c => `<span><span class="dot ${c}"></span> ${Math.round(t[c]/tot*100)}%</span>`).join('')}<span>of calories</span></div>`;
}
function defaultMeal(){ const h = new Date().getHours(); return h < 11 ? 'breakfast' : h < 15 ? 'lunch' : h < 21 ? 'dinner' : 'snack'; }

function editFrom(src){
  // src: {name, kcal?, protein?, color?, per100?, grams?, label?, usualId?}
  const e = {view:'edit', meal: sh.meal, name: src.name || '', per100: src.per100 || null, grams: src.grams || null, label: src.label || '',
    kcal: src.kcal ?? null, protein: src.protein ?? null, color: src.color || null, usualId: src.usualId || null, saveUsual: !src.usualId};
  if(e.per100 && e.grams != null && e.kcal == null) recompute(e);
  if(e.per100 && !e.color) e.color = colorFor(e.per100.kcal);

}
function recompute(e){
  if(!e.per100 || !e.grams) return;
  e.kcal = Math.round(e.per100.kcal * e.grams / 100);
  e.protein = Math.round(e.per100.protein * e.grams / 10) / 10;
}

    $('backSheet').onclick = () => { stopScan(); sh = {view:'list', meal: sh.meal, q:''}; renderSheet(); };

function addFood(){
  const name = (sh.name || '').trim();
  if(!name){ toast('Give it a name'); return; }
  if(sh.kcal == null || isNaN(sh.kcal) || sh.kcal < 0){ toast('Enter calories (a guess is fine)'); return; }
  if(!sh.color){ toast('Pick a color'); return; }
  const item = {id: uid(), name, kcal: +sh.kcal, protein: +(sh.protein || 0), color: sh.color, meal: sh.meal, grams: sh.per100 ? sh.grams : null};
  (S.food[editDate] ||= []).push(item);
  const now = today();
  if(sh.usualId){
    const f = S.foods.find(x => x.id === sh.usualId);
    if(f){ f.uses = (f.uses||0) + 1; f.last = now; if(f.per100 && sh.grams) f.grams = sh.grams; }
  } else if(sh.saveUsual){
    const ex = S.foods.find(x => x.name.toLowerCase() === name.toLowerCase());
    const rec = {name, kcal: item.kcal, protein: item.protein, color: item.color, per100: sh.per100, grams: sh.grams, label: sh.label, last: now};
    if(ex){ Object.assign(ex, rec); ex.uses = (ex.uses||0) + 1; }
    else S.foods.push({id: uid(), uses: 1, ...rec});
  }
  // protein target reached → tick today's protein box
  const e = S.entries[editDate];
  if(e && !e.protein && foodTotals(editDate).protein >= S.settings.proteinTarget){ e.protein = true; }
  save(); closeSheet();
  toast(`Logged ${name} · ${Math.round(item.kcal)} cal`);
  if(tab === 'food') renderFood(); else render();
}

// ---------- barcode ----------
let scanStream = null, scanTimer = null;
async function startScan(){
  if(!('BarcodeDetector' in window)) return;
  const msg = t => { const m = document.getElementById('scanMsg'); if(m) m.textContent = t; };
  try{
    const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v = document.getElementById('vid'); if(!v){ stopScan(); return; }
    v.srcObject = scanStream; await v.play();
    scanTimer = setInterval(async () => {
      try{
        const codes = await det.detect(v);
        if(codes.length){ const c = codes[0].rawValue; stopScan(); msg('Found ' + c); lookupBarcode(c); }
      }catch(e){}
    }, 300);
  }catch(e){ msg("Couldn't open the camera. Check camera permission, or type the number below."); }
}
function stopScan(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
  if(scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}
async function lookupBarcode(code){
  const m = document.getElementById('lookMsg'); const say = t => { if(m) m.textContent = t; };
  if(!/^\d{6,14}$/.test(code)){ say('That doesn\'t look like a barcode number.'); return; }
  say('Looking it up…');
  try{
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,nutriments,serving_quantity,serving_size`);
    const j = await r.json();
    const p = j.product, n = p?.nutriments || {};
    const kcal = n['energy-kcal_100g'] ?? (n['energy_100g'] != null ? n['energy_100g'] / 4.184 : null);
    if(j.status !== 1 || kcal == null){ say('Not found in the food database. Use Quick add with the label numbers.'); return; }
    const name = [p.brands?.split(',')[0], p.product_name].filter(Boolean).join(' ').trim() || 'Scanned food';
    const g = parseFloat(p.serving_quantity) || 100;
    if(!sh) return;
    editFrom({name, per100:{kcal: Math.round(kcal), protein: Math.round((n.proteins_100g || 0) * 10) / 10}, grams: Math.round(g), label: p.serving_size || ''});
  }catch(e){ say('Lookup failed — no connection? Use Quick add instead.'); }
}

    <div class="grid2"><div><label class="f">Age</label><input id="cAge" type="number" inputmode="numeric" value="${c.age ?? ''}"></div>
      <div><label class="f">Weight (lb)</label><input id="cW" type="number" inputmode="decimal" value="${w}"></div></div>
    <div class="grid2"><div><label class="f">Height (ft)</label><input id="cFt" type="number" inputmode="numeric" value="${c.ft ?? ''}"></div>
      <div><label class="f">(in)</label><input id="cIn" type="number" inputmode="numeric" value="${c.inch ?? ''}"></div></div>
    <label class="f">Activity</label><select id="cAct">${ACTIVITY.map(([v,l])=>`<option value="${v}" ${+c.act===v?'selected':''}>${l}</option>`).join('')}</select>
    <label class="f">Pace</label><select id="cPace">${PACE.map(([v,l])=>`<option value="${v}" ${(+c.pace||500)===v?'selected':''}>${l}</option>`).join('')}</select>
    <div style="margin-top:12px"><button id="cGo" style="width:100%">Calculate</button></div>
    <div id="cOut"></div></div>`;
}
function wireCalc(){
  const $ = id => document.getElementById(id);
  let sex = (S.settings.calc || {}).sex || null;
  document.querySelectorAll('#cSex button').forEach(b => b.onclick = () => { sex = b.dataset.v; document.querySelectorAll('#cSex button').forEach(x => x.classList.toggle('on', x === b)); });
  $('cGo').onclick = () => {
    const age = +$('cAge').value, w = +$('cW').value, ft = +$('cFt').value, inch = +($('cIn').value || 0), act = +$('cAct').value, pace = +$('cPace').value;
    if(!sex || !age || !w || !ft){ toast('Fill in sex, age, weight and height'); return; }
    const kg = w * 0.4536, cm = (ft*12 + inch) * 2.54;
    const bmr = 10*kg + 6.25*cm - 5*age + (sex === 'm' ? 5 : -161);
    const tdee = bmr * act, floor = sex === 'm' ? 1500 : 1200;
    const raw = tdee - pace, target = Math.max(floor, Math.round(raw / 50) * 50);
    const calc = {sex, age, weight: w, ft, inch, act, pace};
    $('cOut').innerHTML = `<div class="banner info" style="margin-top:12px">
      Estimated daily burn: <b>${Math.round(tdee).toLocaleString()}</b> cal<br>
      Suggested target: <b>${target.toLocaleString()}</b> cal/day
      ${raw < floor ? `<br><span class="small">Capped at ${floor.toLocaleString()}, a common minimum without medical supervision. You'll lose a bit slower than the pace you picked.</span>` : ''}
      <div class="row"><button id="cUse">Use ${target.toLocaleString()} cal</button></div></div>`;
    $('cUse').onclick = () => { S.settings.calorieTarget = target; S.settings.calc = calc; save(); toast('Calorie target set'); render(); };
  };
}


// ---------- scale sync (Android app only, via Health Connect) ----------
function scaleCardHtml(){
  const h = S.hc;
  return `<div class="card" id="scaleCard"><h2>Smart scale</h2>
    <p class="small muted" style="margin:0 0 8px">Reads weigh-ins from Health Connect. Make sure your scale's app is set to share weight with Health Connect. Steady uses your first weigh-in of each day; a weight you type yourself always wins.</p>
    ${h.enabled ? `<p class="small" style="margin:0 0 8px">✅ Connected${h.last ? ` · last synced ${new Date(h.last).toLocaleString()}` : ''}</p>
      <div class="row"><button id="hcSync">Sync now</button><button id="hcOff">Turn off</button></div>`
      : `<button id="hcOn" style="width:100%">Connect to Health Connect</button>`}
    <p class="small muted" id="hcMsg"></p></div>`;
}
function wireScale(){
  const $ = id => document.getElementById(id), msg = t => { const m = $('hcMsg'); if(m) m.textContent = t; };
  if($('hcOn')) $('hcOn').onclick = async () => {
    try{
      const {status} = await Native.availability();
      if(status !== 'available'){ msg(status === 'update_required' ? 'Health Connect needs an update from the Play Store.' : 'Health Connect is not available on this phone.'); return; }
      const {granted} = await Native.requestPermission();
      if(!granted){ msg('Permission not granted. You can allow it in Health Connect settings.'); return; }
      S.hc.enabled = true; save(); await syncScale(true); renderPlan();
    }catch(e){ msg('Could not connect: ' + (e.message || e)); }
  };
  if($('hcSync')) $('hcSync').onclick = async () => { await syncScale(true); renderPlan(); };
  if($('hcOff')) $('hcOff').onclick = () => { S.hc.enabled = false; save(); renderPlan(); };
}
let syncing = false;
async function syncScale(interactive){
  if(!Native || !S.hc.enabled || syncing) return;
  syncing = true;
  try{
    const {records} = await Native.readWeights({since: Date.now() - 30*864e5});
    const first = {};   // earliest reading per local day
    for(const r of records){ const d = ds(new Date(r.time)); if(!first[d] || r.time < first[d].time) first[d] = r; }
    let n = 0;
    for(const [d, r] of Object.entries(first)){
      const lb = Math.round(r.kg * 2.20462 * 10) / 10;
      if(S.scale[d] !== lb){ S.scale[d] = lb; n++; }
    }
    S.hc.last = Date.now(); save();
    if(n){
      if(draft && !S.entries[draft._date] && draft.weight == null) draft.weight = S.scale[draft._date] ?? null;
      if(!document.getElementById('sheetBg') && tab !== 'plan') render();
    }
    if(interactive) toast(n ? `Synced ${n} weigh-in${n > 1 ? 's' : ''} from your scale` : 'Up to date — no new weigh-ins');
  }catch(e){ if(interactive) toast('Scale sync failed: ' + (e.message || e)); }
  finally{ syncing = false; }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; if(tab==='today' || tab==='food') editDate = today(); draft = null; render(); });
// If the app stays open past midnight, jump to the new day when reopened.
document.addEventListener('visibilitychange', () => { if(!document.hidden && tab==='today' && !draft?.weight && editDate < today()){ editDate = today(); draft = null; render(); } });
render();
if(!Native && 'serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
syncScale(false);
document.addEventListener('visibilitychange', () => { if(!document.hidden) syncScale(false); });
</script>
